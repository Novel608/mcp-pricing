server:
  port: 8080

spring:
  application:
    name: mcd-ledger-server
  datasource:
    url: jdbc:h2:file:./data/ledger;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data-sandbox.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console

# MyBatis-Plus：全程注解，不写 XML
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# MCP 接入配置（设计 §6.1 / §3.5）
mcd:
  mcp:
    server-url: https://mcp.mcd.cn
    token: ${MCD_MCP_TOKEN:}
    rate-limit-per-min: 600
  sandbox:
    enabled: true
  plan:
    # 能力级别（A1=L0 全量）：L0 / L2+ / L2；与前端 VITE_PLAN_CAPABILITY_LEVEL 必须一致
    capability-level: L0
    # 报价过期阈值（分钟），软提示不阻断
    stale-threshold-minutes: 30
    # 套餐组合规则（R1）：只描述「套餐由哪些单品构成」的活动信息，价格一律取官方菜单
    combos:
      - combo-item-id: "9900005456"
        name: "麦辣鸡腿汉堡三件套"
        covers:
          - item-id: "1440"
            name: "麦辣鸡腿汉堡"
            quantity: 1
          - item-id: "4810"
            name: "薯条"
            quantity: 1
          - item-id: "9900008751"
            name: "可乐"
            quantity: 1
      - combo-item-id: "9900005462"
        name: "板烧鸡腿堡三件套"
        covers:
          - item-id: "1406"
            name: "板烧鸡腿堡"
            quantity: 1
          - item-id: "4810"
            name: "薯条"
            quantity: 1
          - item-id: "9900008751"
            name: "可乐"
            quantity: 1
      - combo-item-id: "9900005466"
        name: "巨无霸三件套"
        covers:
          - item-id: "1100"
            name: "巨无霸"
            quantity: 1
          - item-id: "4810"
            name: "薯条"
            quantity: 1
          - item-id: "9900008751"
            name: "可乐"
            quantity: 1
    # 满减档位（R2）：活动规则以门店公示为准；当前小计仍由官方菜单参考价算出
    thresholds:
      - title: "满 100 减 15"
        threshold-cents: 10000
        discount-cents: 1500
      - title: "满 200 减 30"
        threshold-cents: 20000
        discount-cents: 3000

logging:
  level:
    com.mcd.ledger: INFO
